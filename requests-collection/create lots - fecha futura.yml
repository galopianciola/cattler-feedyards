info:
  name: create lots - fecha futura
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/api/lots/"
  headers:
    - name: Authorization
      value: Token {{AUTH_TOKEN}}
  body:
    type: json
    data: |-
      {
        "quantity": 10,
        "entry_date": "2099-01-01",
        "average_weight": 2
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
